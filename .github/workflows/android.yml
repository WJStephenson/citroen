# Builds the Android wrapper — the PWA as a Trusted Web Activity, plus the
# charge widget — and leaves a signed APK attached to the run.
#
# This exists so nothing has to be installed to ship the app: the Android SDK,
# the JDK and the signing key all live here rather than on a laptop. Download
# the artifact, sideload it, done.
#
# The secrets it wants, none of which are in the repo:
#
#   CITROEN_VIN             the car
#   CF_ACCESS_CLIENT_ID     a Cloudflare Access service token, scoped to the
#   CF_ACCESS_CLIENT_SECRET read path only — see android/secrets.properties.example
#   KEYSTORE_BASE64         base64 of the signing key, from deploy/make-signing-key.sh
#   KEYSTORE_PASSWORD       what you typed when you made it
#   KEY_ALIAS               "citroen" unless you changed it
#
# Without the keystore secrets the release APK is unsigned and cannot be
# installed; the job says so rather than uploading something that will not
# install. Without the VIN or the token it still builds — the widget reports
# itself as not set up, which is the honest failure.

name: Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/*.gradle.kts

      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret — the APK will be unsigned and will not install."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Outside the workspace, so no build step can sweep it into an
          # artifact and publish the app's identity.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/citroen-release.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/citroen-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=${KEY_ALIAS:-citroen}"
          } > android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: android
        env:
          CITROEN_VIN: ${{ secrets.CITROEN_VIN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test assembleRelease

      - name: Check the APK is installable
        if: steps.signing.outputs.signed == 'true'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "no APK at $APK"; exit 1; }
          # An unsigned APK builds happily and then fails on the phone with a
          # message that says nothing useful, so it is caught here instead.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: citroen-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove the signing key
        if: always()
        run: rm -f android/keystore.properties "$RUNNER_TEMP/citroen-release.jks"
