# ë-C4 PWA — drop-in server block for an existing nginx container.
#
# Assumes you already have: a domain, a Cloudflare Tunnel pointing at this
# nginx, and psa_car_controller reachable on the same Docker network.
#
# Full walkthrough: see DEPLOYMENT.md next to this file.
#
# nginx resolves upstream names at config load, so if `nginx -t` fails with
# "host not found in upstream", the two containers are not on the same network
# yet — fix that before anything else.
#
# Two responsibilities:
#   1. Serve the built PWA (dist/) as a static SPA.
#   2. Proxy /api/* to psa_car_controller:5000, stripping the /api prefix.
#
# Copy into your nginx conf.d/ and reload:
#   docker cp deploy/nginx-citroen.conf <nginx-container>:/etc/nginx/conf.d/citroen.conf
#   docker exec <nginx-container> nginx -t && docker exec <nginx-container> nginx -s reload

server {
    listen 80;
    server_name citroen.yourdomain.com;   # <-- your tunnel hostname

    # The tunnel terminates TLS at Cloudflare's edge, so this listener is
    # plain HTTP on the internal Docker network only. Do not expose port 80
    # to the internet directly.

    root /usr/share/nginx/html/citroen;   # <-- where you copied dist/
    index index.html;

    client_max_body_size 1M;

    # ---- app shell ---------------------------------------------------------

    # Hashed filenames are immutable, so they can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # These three must NEVER be cached by the CDN or the browser HTTP cache.
    # The service worker manages its own cache; a stale sw.js or index.html
    # pinned by an intermediary makes the app impossible to update.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA fallback: every unmatched path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- bridge API --------------------------------------------------------

    # The trailing slash on proxy_pass is what strips the /api prefix:
    #   /api/get_vehicleinfo/VIN  ->  psa_car_controller:5000/get_vehicleinfo/VIN
    # The PWA's dev server does the same rewrite, so app code is identical.
    location /api/ {
        proxy_pass http://psa_car_controller:5000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Waking the car over the cellular network takes 30-90s. These must
        # exceed that window or nginx returns 504 while the car is still
        # answering. The PWA client gives up at 115s, just under this.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 15s;

        # Telemetry is never cacheable — see the service worker's
        # network-only strategy for the matching client-side rule.
        add_header Cache-Control "no-store" always;
        proxy_buffering off;

        # ------------------------------------------------------------------
        # SECURITY: psa_car_controller has NO authentication of its own.
        # Anything that reaches this location can unlock, pre-condition and
        # reconfigure charging on your car.
        #
        # Protect the hostname with Cloudflare Access (recommended: it gives
        # the PWA a session cookie that rides along automatically), or
        # uncomment the Basic Auth fallback below.
        #
        #   auth_basic           "e-C4";
        #   auth_basic_user_file /etc/nginx/.htpasswd;
        #
        # If you use Basic Auth, apply it to `location /` as well — otherwise
        # the app shell is public even though the API is not.
        # ------------------------------------------------------------------
    }

    # ---- shared settings ----------------------------------------------------

    # VIN, poll interval, tariff, dashboard layout and charge hints, shared
    # across every phone controlling the car instead of living in each
    # browser's own localStorage. See docker-compose.settings.yml.
    location /settings/ {
        proxy_pass http://settings_store:8090/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;
        proxy_buffering off;
    }

    # Optional: keep psa_car_controller's own web UI reachable for the initial
    # login wizard and OTP enrolment, without it owning the root path.
    location /bridge/ {
        proxy_pass http://psa_car_controller:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
