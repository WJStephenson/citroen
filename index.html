<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>ë-C4</title>
    <meta name="description" content="Remote control for the Citroën ë-C4" />

    <!--
      Android home-screen install + standalone chrome.

      crossorigin="use-credentials" is REQUIRED here, not optional. Browsers
      fetch the manifest with credentials mode "omit" by default — even
      same-origin — so behind Cloudflare Access the request is bounced to the
      login page, the manifest never parses, and Android falls back to a
      generic icon. This attribute makes the fetch send the Access cookie.
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#121212" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Sets the theme before the stylesheet paints, so a light-mode choice
      // never flashes dark first. Kept in sync with src/theme.ts.
      (function () {
        var theme = localStorage.getItem('ec4.theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2f2f4')
        }
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ë-C4" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Vehicle commands must never be prefetched or speculatively loaded -->
    <meta name="referrer" content="same-origin" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
